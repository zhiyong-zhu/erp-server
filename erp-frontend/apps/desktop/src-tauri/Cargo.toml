[package]
name = "erp-desktop"
version = "1.0.0"
description = "ERP 桌面版"
authors = ["ERP Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
image = "0.25"
printpdf = "0.7"
tauri-plugin-updater = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
